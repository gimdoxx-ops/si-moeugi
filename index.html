<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>시 주머니</title>
<!-- ── 사이트 기본 정보 ── -->
<meta name="description" content="하루에 한 번, 주머니에서 시 한 편을 꺼내 읽는 곳">
<meta name="theme-color" content="#e8e6dc" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1f2227" media="(prefers-color-scheme: dark)">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<!-- ── 카카오톡·문자 등으로 주소를 보낼 때 뜨는 미리보기 ──
     사이트 주소가 바뀌면 아래 og:url, og:image 두 줄의 주소도 함께 바꿔 주세요.
     (카카오톡은 그림 주소가 https://로 시작하는 전체 주소여야 그림을 보여줘요) -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="시 주머니">
<meta property="og:title" content="시 주머니">
<meta property="og:description" content="하루에 한 번, 주머니에서 시 한 편을 꺼내 읽는 곳">
<meta property="og:url" content="https://gimdoxx-ops.github.io/si-moeugi/">
<meta property="og:image" content="https://gimdoxx-ops.github.io/si-moeugi/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="시 주머니 (pocket poem)">
<meta property="og:locale" content="ko_KR">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#e8e6dc; --paper2:#dedbd0; --ink:#242a33; --soft:#5d6470; --line:#b9b6a8; --btn-line:var(--line); --seal:#a63a32;
  --grain:.07; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--paper:#1f2227; --paper2:#262a30; --ink:#e4e2d9; --soft:#9aa0a8; --line:#3a3f47; --btn-line:#5b616b; --seal:#c95b52; --grain:.12}
}
:root[data-theme="dark"]{--paper:#1f2227; --paper2:#262a30; --ink:#e4e2d9; --soft:#9aa0a8; --line:#3a3f47; --btn-line:#5b616b; --seal:#c95b52; --grain:.12}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{
  margin:0; min-height:100vh; color:var(--ink); background-color:var(--paper);
  background-image:
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .33  0 0 0 0 .28  0 0 0 .9 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='.55'/></svg>"),
    radial-gradient(120% 80% at 50% 0%, var(--paper2), transparent 70%);
  font-family:"Nanum Myeongjo","Noto Serif KR","Apple SD Gothic Neo",serif;
  line-height:1.9; -webkit-font-smoothing:antialiased;
}
main{max-width:560px; margin:0 auto; padding:28px 28px 56px}
/* ── 맨 위: 홈페이지 이름 + 날짜 한 줄 ── */
header{text-align:center; padding-top:8px}
/* 타이틀 이미지: 화면 폭에 맞춰 줄어들고, 높이는 낮게 (폰에서 약 80px) */
.site{margin:0; line-height:0; font-size:1rem}
.home{display:inline-block; color:inherit; text-decoration:none; border-radius:4px; -webkit-tap-highlight-color:transparent}   /* 누르면 첫 화면으로 */
.home:focus-visible{outline:2px solid var(--seal); outline-offset:4px}
.home img{display:block; width:min(78vw,300px); height:auto; filter:var(--title-img)}
.from{margin:0 0 6px; color:var(--soft); font-size:.88rem; letter-spacing:.04em}
.date{margin:8px 0 0; color:var(--soft); font-size:clamp(1.1rem,4.8vw,1.3rem); letter-spacing:.04em}
.mood{margin:4px 0 0; min-height:1.6em; color:var(--soft); opacity:.75; font-size:.88rem; letter-spacing:.04em}   /* 시간대에 따라 바뀌는 한 줄 */
.opened .mood{display:none}                     /* 편지지를 연 뒤(시 읽는 화면)에는 숨기고, 주머니 화면에서만 보여요 */
/* ── 내 생각 적기 (평소엔 접혀 있어요) ── */
.memo{margin-top:16px}
.memo > *,.diary > *{box-sizing:border-box}   /* 접었다 펴는 상자 안에서도 글 칸이 오른쪽으로 삐져나오지 않게 */
.memo summary{display:inline-flex; align-items:center; gap:6px; min-height:44px; padding:0 2px; color:var(--soft); font-size:.92rem; cursor:pointer; list-style:none}
.memo summary::-webkit-details-marker{display:none}
.memo summary::before{content:"+"; display:inline-block; width:1em; text-align:center}
.memo[open] summary::before{content:"−"}
.memo summary:hover{color:var(--ink)}
.memo summary:focus-visible{outline:2px solid var(--seal); outline-offset:2px}
.memo textarea{
  display:block; width:100%; margin-top:4px; padding:12px 14px; resize:vertical; min-height:7.5em;
  font:inherit; font-size:1rem; line-height:1.8; color:var(--ink);
  background:var(--paper2); border:1px solid var(--line); border-radius:3px;
}
.memo textarea::placeholder{color:var(--soft); opacity:.7}
.memo textarea:focus{outline:2px solid var(--seal); outline-offset:1px}
.memo-status{margin:4px 0 0; min-height:1.3em; text-align:right; color:var(--soft); font-size:.8rem; opacity:0; transition:opacity .4s}
.memo-status.show{opacity:.8}
/* ── 편지지: 제목·시인·본문만 편지지 그림(letter-*.webp) 위에 ──
   그림을 위·가운데·아래 세 조각으로 나눴어요.
   위(찢어진 윗가장자리)와 아래(깃펜·잉크병)는 원래 비율 그대로, 가운데만 시 길이만큼 이어 붙여서 찌그러지지 않아요. */
.letter{position:relative; margin:24px -12px 0}
/* 여백은 모두 '편지지 폭에 대한 %'로 적었어요 (padding·margin의 %는 폭 기준이라 어느 브라우저에서나 같아요) */
.letter-bg{
  position:absolute; inset:0; display:flex; flex-direction:column; pointer-events:none;
  filter:var(--letter-img) drop-shadow(0 6px 10px rgba(40,30,20,.14));
}
.letter-bg i{display:block; flex:none; background-repeat:no-repeat; background-size:100% 100%}
.lt-top{aspect-ratio:1111/213; background-image:url("letter-top.webp")}
.letter-bg .lt-mid{flex:1 1 0; min-height:0; margin-top:-2px; background:url("letter-mid.webp") 0 0/100% auto repeat-y}
.lt-bot{aspect-ratio:1111/329; margin-top:-5.4%; background-image:url("letter-bottom.webp")}   /* 가운데와 살짝 겹쳐 이음매가 안 보이게 */
.poem{
  position:relative; color:var(--letter-ink);
  padding:14% 11.5% 21%;            /* 이중 테두리 안쪽, 깃펜·잉크병 위까지만 글 */
}
.poem::before{content:""; display:block; float:left; padding-top:12%}   /* 아주 짧은 시도 위·아래 조각이 겹치지 않게(최소 높이) */
.poem::after{content:""; display:block; clear:both}
.poem .from{color:var(--letter-soft)}
/* 제목·시인 영역: 가로 줄 없음, 제목 → 시인 → 본문 사이 여백 넉넉히 */
.head{margin:0 0 30px; background:none}
#title,.dv-title{font-size:clamp(1.45rem,6vw,1.9rem); line-height:1.45; margin:0; font-weight:700; letter-spacing:.02em; word-break:keep-all; overflow-wrap:anywhere}
#title:focus{outline:none}
.author{display:block; margin-top:10px; color:var(--letter-soft); font-size:.98rem; line-height:1.5}
.body{
  font-size:clamp(1rem,4vw,1.12rem); line-height:2; margin:0;
  /* 긴 줄이 폰에서 넘칠 때 낱말 중간이 아니라 띄어쓰기 자리에서 꺾이게 (아주 긴 낱말만 예외) */
  word-break:keep-all; overflow-wrap:anywhere;
}
/* 시의 한 줄 = 한 덩어리 (setPoemText가 줄마다 나눠 넣어요)
   · 화면 폭 때문에 넘어간 부분만 살짝 들여 써요(내어쓰기) → 시인이 바꾼 줄과 구분돼요
   · 아주 옅은 가로 줄은 덩어리 맨 아래에만 하나 (넘어간 부분에는 줄을 긋지 않아요)
   · 덩어리 높이는 늘 2em의 배수라서, 줄은 지금처럼 글줄 간격에 딱 맞아요 */
.body .ln{
  display:block; min-height:2em; padding-left:1.5em; text-indent:-1.5em;
  background:linear-gradient(var(--rule),var(--rule)) left bottom/100% 1px no-repeat;
}
/* 주머니 속 한마디: 편지지 바로 아래, 한지 바탕 위에 작은 글씨 + 왼쪽 얇은 붉은 선 */
.note{margin-top:22px; padding:2px 0 0 16px; border-left:2px solid var(--seal); color:var(--soft); font-size:.92rem; line-height:1.85}
.note h2{margin:0 0 12px; font-size:1rem; font-weight:700; color:var(--ink); letter-spacing:.04em}
.note p{margin:0 0 .8em; max-width:34em}
/* ── 이 시를 내 주머니에 넣을까요? ── */
.ask{margin-top:30px; text-align:center}
.ask-q{margin:0 0 12px; font-size:1rem; letter-spacing:.02em}
.ask-btns{display:flex; justify-content:center; flex-wrap:wrap; gap:10px}
.ask-btns button{min-width:7.5em}
.ask .yes{color:var(--seal); border-color:var(--seal)}
.ask.done{display:flex; justify-content:center; align-items:center; flex-wrap:wrap; gap:4px 10px}
.ask-msg{margin:0; color:var(--seal); font-size:.98rem}
button.link{border:0; padding:4px 6px; min-height:36px; color:var(--soft); font-size:.88rem; text-decoration:underline; text-underline-offset:3px}
button.link:hover{color:var(--ink)}
button{font:inherit; color:var(--ink); background:none; border:1px solid var(--btn-line); padding:9px 16px; border-radius:2px; cursor:pointer; min-height:44px}
button:hover{border-color:var(--ink)}
button:focus-visible{outline:2px solid var(--seal); outline-offset:2px}
button:disabled{opacity:.35; cursor:default; border-color:var(--line)}
/* ── 맨 아래 짧은 안내 ── */
.site-foot{margin-top:64px; padding-top:18px; border-top:1px solid var(--line); color:var(--soft); opacity:.85; font-size:.78rem; line-height:1.75}
.site-foot ul{list-style:none; margin:0; padding:0}
.site-foot li{margin:0 0 4px}
.site-foot a{color:inherit}
.saved{margin-top:40px; border-top:1px solid var(--line); padding-top:20px; color:var(--soft); font-size:.98rem}
.saved ul{list-style:none; padding:0; margin:8px 0 0}
.saved li button{border:0; padding:4px 0; min-height:36px; color:var(--ink); text-align:left}
.saved li button span{color:var(--soft)}
/* ── 내 기록: 날짜별로 적은 '내 생각'을 다시 보는 작은 달력 (처음엔 접혀 있어요) ── */
.diary{margin-top:40px; border-top:1px solid var(--line); padding-top:6px}
.diary > summary{display:flex; align-items:center; gap:6px; min-height:48px; color:var(--soft); font-size:.98rem; cursor:pointer; list-style:none}
.diary > summary::-webkit-details-marker{display:none}
.diary > summary::before{content:"+"; display:inline-block; width:1em; text-align:center}
.diary[open] > summary::before{content:"−"}
.diary > summary:hover{color:var(--ink)}
.diary > summary:focus-visible{outline:2px solid var(--seal); outline-offset:2px}
.cal{max-width:360px; margin:4px auto 0}
.cal-head{display:flex; align-items:center; justify-content:space-between}
.cal-month{margin:0; font-size:1rem; letter-spacing:.08em}
.cal-nav{border:0; width:48px; height:48px; padding:0; font-size:1.35rem; line-height:1; color:var(--soft)}   /* 이전 달 / 다음 달 */
.cal-nav:hover{color:var(--ink)}
.cal-nav:disabled{opacity:.25; cursor:default}
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); text-align:center}
.cal-wd{padding:6px 0 4px; font-size:.75rem; color:var(--soft); opacity:.8}
.cal-day{display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:48px; padding:0; border:0; border-radius:0; color:var(--soft); font-size:.92rem; line-height:1}
.cal-day .num{display:grid; place-items:center; width:2.2em; height:2.2em; border-radius:50%}
.cal-day::after{content:""; width:4px; height:4px; margin-top:1px; border-radius:50%; background:transparent}   /* 글을 적은 날의 작은 점 자리 */
.cal-day.has{color:var(--ink); cursor:pointer}
.cal-day.has::after{background:var(--seal)}
.cal-day.has:hover .num{background:var(--paper2)}
.cal-day.today .num{box-shadow:inset 0 0 0 1px var(--btn-line)}   /* 오늘: 옅은 동그라미 */
.cal-day.can{color:var(--ink); cursor:pointer}   /* 그날의 시를 다시 볼 수 있는 날 */
.cal-day.can:hover .num{background:var(--paper2)}
.cal-day.off{opacity:.4}                          /* 사이트를 열기 전 날짜·미래 날짜: 흐리게, 눌러도 아무 일 없어요 */
.cal-day.sel .num{background:var(--paper2); color:var(--seal); font-weight:700}   /* 지금 펼쳐 본 날 */
.cal-foot{margin:14px 0 4px; text-align:center; color:var(--soft); opacity:.8; font-size:.78rem}
.dv{margin-top:18px}
.dv-date{margin:0; text-align:center; color:var(--soft); font-size:.88rem; letter-spacing:.04em}
.dv .letter{margin-top:8px}
.tomorrow{margin:20px 0 0; color:var(--soft); opacity:.7; font-size:.8rem; letter-spacing:.03em}   /* 내일 시 제목: 작고 연하게 */
.dv-memo label{display:block; color:var(--soft); font-size:.92rem}
.old{margin-top:22px; color:var(--soft); font-size:.92rem}
.old-h{margin:0}
.old ul{list-style:none; padding:0; margin:4px 0 0}
.old li button{border:0; padding:4px 0; min-height:40px; color:var(--ink); text-align:left}
.old li button span{color:var(--soft)}
@media (prefers-reduced-motion:no-preference){
  .poem.in{animation:set .9s ease-out both}
  .ask > *{animation:set .4s ease-out both}           /* 질문 자리가 바뀔 때 살며시 */
  @keyframes set{from{opacity:0}to{opacity:1}}
}

/* ── 위쪽 '주머니 닫기' 버튼 ── */
.bar{display:flex; justify-content:flex-end; margin:22px 0 0; padding-bottom:10px; border-bottom:1px solid var(--line)}
#closeBtn{font-size:.85rem; padding:6px 12px; min-height:40px; color:var(--soft)}
#closeBtn:hover{color:var(--ink)}

/* ── 첫 화면: 가죽 주머니 ── */
:root{
  --shadow:rgba(40,30,20,.28);                       /* 주머니 바닥 그림자 */
  --photo:none;                                      /* 주머니 사진 밝기 (어두운 모드에선 살짝 낮춤) */
  --title-img:none;                                  /* 타이틀 이미지 밝기 (어두운 모드에선 살짝 낮춤) */
  --letter-img:none;                                 /* 편지지 그림 밝기 (어두운 모드에선 살짝 낮춤) */
  --letter-ink:#2b2520; --letter-soft:#6e604f;       /* 편지지 위 글씨 (편지지가 늘 밝은 종이라 두 모드 같은 색) */
  --rule:rgba(110,88,60,.2);                         /* 편지지 위 가로 줄 */
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--shadow:rgba(0,0,0,.5); --photo:brightness(.86); --title-img:brightness(.8) saturate(.9);
    --letter-img:brightness(.76) saturate(.9); --letter-soft:#5b4f41; --rule:rgba(60,46,30,.22)}
}
:root[data-theme="dark"]{--shadow:rgba(0,0,0,.5); --photo:brightness(.86); --title-img:brightness(.8) saturate(.9);
  --letter-img:brightness(.76) saturate(.9); --letter-soft:#5b4f41; --rule:rgba(60,46,30,.22)}

/* 주머니가 닫혀 있을 땐 주머니만, 열었으면 시만 보여요 (html에 opened 표시가 붙으면 열린 상태) */
.opened #gate{display:none}
html:not(.opened) #content{display:none}
.gate{display:flex; justify-content:center; padding:4px 0 32px}
.stage{display:flex; flex-direction:column; align-items:center; text-align:center}
.pouch-btn{border:0; padding:0; background:none; min-height:0; border-radius:12px; cursor:pointer; -webkit-tap-highlight-color:transparent}
.pouch-btn:focus-visible{outline:2px solid var(--seal); outline-offset:8px}
.pouch-wrap{
  --w:min(50vw,200px);
  position:relative; width:var(--w); aspect-ratio:560/625;
  margin-top:calc(var(--w)*.12);
}
.photo{
  position:absolute; inset:0; background:var(--pouch-photo) center/100% 100% no-repeat;
  filter:var(--photo); transform-origin:50% 100%;
}
.ground{position:absolute; z-index:0; left:6%; right:6%; bottom:-4%; height:9%; background:radial-gradient(closest-side, var(--shadow), transparent)}
.gate-text{margin-top:26px}
.gate-q{margin:0; font-size:clamp(1.1rem,4.6vw,1.3rem); font-weight:700; letter-spacing:.02em}
.gate-hint{margin:10px 0 0; color:var(--soft); font-size:.85rem}

/* 단계별 모습 (JS가 단계마다 class를 붙입니다)
   open: 입구가 살짝 벌어짐 → fade: 주머니가 천천히 흐려짐 → rising: 편지지가 아래에서 조금 올라오며 선명해짐 */
.open .pouch-wrap{transform:scale(1.035,.985)}
.fade{opacity:0}

@media (prefers-reduced-motion:no-preference){
  .gate{animation:set .45s ease-out}
  .gate.fade{animation:none; transition:opacity .5s ease}
  .pouch-btn{transition:transform .3s ease}
  .pouch-btn:hover,.pouch-btn:focus-visible{transform:translateY(-3px)}
  /* 주머니가 숨 쉬듯 아주 천천히, 아주 살짝 (약 4.5초에 한 번) */
  .pouch-wrap{transform-origin:50% 100%; animation:breathe 4.5s ease-in-out infinite; transition:transform .35s ease-out}
  .open .pouch-wrap{animation:none}
  @keyframes breathe{50%{transform:scale(1.02,1.015)}}
  .rising .letter{animation:rise .8s cubic-bezier(.2,.7,.3,1) both}
  .rising .bar,.rising .note,.rising .tomorrow{animation:set .8s ease-out both}
  @keyframes rise{from{opacity:0; transform:translateY(18px)} to{opacity:1; transform:none}}
}

<!-- 가죽 주머니 (하루 첫 방문 때만 닫혀 있어요) -->
<div class="gate" id="gate">

        <div class="photo" aria-hidden="true"></div>
      </div>
    </button>
    <div class="gate-text">
      <p class="gate-q">오늘은 어떤 시가 들어 있을까요</p>
      <p class="gate-hint">주머니를 눌러 열어 보세요</p>
    </div>
  </div>
</div>

<!-- 주머니에서 꺼낸 시 -->
<div id="content">
  <div class="bar"><button id="closeBtn">주머니 닫기</button></div>
  <!-- 편지지 한 장: 제목·시인·본문 -->
  <div class="letter" id="letter">
    <div class="letter-bg" aria-hidden="true"><i class="lt-top"></i><i class="lt-mid"></i><i class="lt-bot"></i></div>
    <article class="poem" id="poem" aria-live="polite">
      <p class="from" id="from" hidden>내 주머니에서 꺼낸 시</p>
      <div class="head"><h2 id="title"></h2><span class="author" id="author"></span></div>
      <p class="body" id="text"></p>
    </article>
  </div>
  <!-- 주머니 속 한마디: 편지지 바로 아래 -->
  <section class="note" id="note" aria-label="주머니 속 한마디"></section>
  <!-- 내일 시 제목만 살짝 (오늘의 시를 볼 때만 보여요. 눌러도 아무 일 없어요) -->
  <p class="tomorrow" id="tomorrow"></p>
  <!-- 내 생각 적기: 그날그날 일기처럼, 이 브라우저에 저장돼요 (오늘의 시를 볼 때만 보여요) -->
  <details class="memo" id="memo">
    <summary>내 생각 적기</summary>
    <textarea id="memoText" rows="4" maxlength="1000" aria-label="내 생각" placeholder="이 시를 읽고 떠오른 생각을 짧게 적어 보세요"></textarea>
    <p class="memo-status" id="memoStatus" aria-live="polite"></p>
  </details>
  <!-- 이 시를 내 주머니에 넣을까요? (상태에 따라 내용이 바뀌어요) -->
  <section class="ask" id="ask" aria-live="polite"></section>
  <section class="saved" id="saved" hidden>
    내 주머니
    <ul id="savedList"></ul>
  </section>
  <!-- 내 기록: 날짜별로 적은 '내 생각'을 달력으로 다시 봐요 (처음엔 접혀 있어요) -->
  <details class="diary" id="diary">
    <summary>내 기록</summary>
    <div class="cal">
      <div class="cal-head">
        <button class="cal-nav" id="calPrev" type="button" aria-label="이전 달">‹</button>
        <p class="cal-month" id="calMonth" aria-live="polite"></p>
        <button class="cal-nav" id="calNext" type="button" aria-label="다음 달">›</button>
      </div>
      <div class="cal-grid" id="calGrid"></div>
    </div>
    <!-- 점이 있는 날을 누르면: 그날의 시 + 그날 적은 글 (여기서 고칠 수도 있어요) -->
    <div class="dv" id="dayView" hidden>
      <p class="dv-date" id="dvDate"></p>
      <div class="letter">
        <div class="letter-bg" aria-hidden="true"><i class="lt-top"></i><i class="lt-mid"></i><i class="lt-bot"></i></div>
        <article class="poem">
          <div class="head"><h3 class="dv-title" id="dvTitle"></h3><span class="author" id="dvAuthor"></span></div>
          <p class="body" id="dvText"></p>
        </article>
      </div>
      <section class="note" id="dvNote" aria-label="주머니 속 한마디"></section>
      <div class="memo dv-memo">
        <label for="dvMemo">내가 적은 글</label>
        <textarea id="dvMemo" rows="4" maxlength="1000"></textarea>
        <p class="memo-status" id="dvStatus" aria-live="polite"></p>
      </div>
    </div>
    <!-- 날짜 기록이 생기기 전에 시마다 적어 둔 글 (지우지 않고 여기 모아 둬요) -->
    <div class="old" id="oldMemos" hidden>
      <p class="old-h">날짜 없는 예전 글</p>
      <ul id="oldList"></ul>
    </div>
    <p class="cal-foot">기록은 이 기기의 브라우저에만 남아요</p>
  </details>
</div>
  <!-- 맨 아래 짧은 안내 -->
  <footer class="site-foot">
    <ul>

      <li id="contact">문의사항은 <a href="mailto:dokuer@naver.com">dokuer@naver.com</a>로 연락 부탁드립니다.</li>
    </ul>
  </footer>

const keyOf = p => p.title + "|" + p.author;

  // 예전에는 '몇 번째 시'라는 숫자로 저장했어요 → 그때 목록(아래 4편) 기준으로 제목|시인으로 바꿔 둡니다
  // (지금 목록의 같은 번호로 바꾸면 엉뚱한 시가 주머니에 들어가요. 지금 목록에 없는 시는 화면에서 건너뛰어요)
  const OLD = ["서시|윤동주", "진달래꽃|김소월", "엄마야 누나야|김소월", "새로운 길|윤동주"];
  if (!Array.isArray(a)) a = [];
  return [...new Set(a.map(x => typeof x === "number" ? (OLD[x] || null) : (typeof x === "string" ? x : null)).filter(Boolean))];
}
function saveFavs(a){ try { localStorage.setItem("favs", JSON.stringify(a)); } catch(e){} }
let favs = loadFavs(); saveFavs(favs);
let justAdded = null;                 // 방금 넣은 시 (→ "주머니에 넣었어요")
const skipped = new Set();            // [그냥 둘게요]를 누른 시 (이번에 머무는 동안만 기억)

// 날짜 한 줄: 예) 2026년 11월 21일 토요일 (늘 오늘 날짜)
// 날짜 모양을 한곳에서 정해요: 예) 2026.11.22 (일). 날짜가 새로 나오는 곳이 생기면 이 함수를 쓰세요.
function fmtDate(d){
  const p = n => String(n).padStart(2, "0");
  return d.getFullYear() + "." + p(d.getMonth() + 1) + "." + p(d.getDate()) + " (" + "일월화수목금토"[d.getDay()] + ")";
}
$("date").textContent = fmtDate(today);

// 시 본문을 줄마다 한 덩어리(.ln)로 넣어요. 빈 줄은 연과 연 사이예요.
function setPoemText(el, text){
  el.textContent = "";
  String(text).split("\n").forEach(line => {
    const s = document.createElement("span"); s.className = "ln"; s.textContent = line; el.appendChild(s);
  });
}

// 날짜 아래 한 줄: 지금 시간대에 맞는 문장 (문장을 바꾸고 싶으면 따옴표 안만 고치면 돼요)
function moodNow(h){
  if (h >= 5  && h < 7)  return "고요한 새벽이에요";
  if (h >= 7  && h < 11) return "아침 햇살이 스며들어요";
  if (h >= 11 && h < 17) return "한낮이 천천히 지나가요";
  if (h >= 17 && h < 20) return "저녁이 내려앉고 있어요";
  return "깊은 밤이에요";
}
function updateMood(){ $("mood").textContent = "“" + moodNow(new Date().getHours()) + "”"; }   // 문장을 따옴표로 감싸서 보여줘요
updateMood();
setInterval(updateMood, 60000);                         // 1분마다 살펴서, 시간대가 바뀌면 문장도 바뀌어요
document.addEventListener("visibilitychange", () => { if (!document.hidden) updateMood(); });

// ── 내 생각: 날짜마다 따로 이 브라우저에 저장돼요 ──
// 'diary' = { "2026-11-22": { text: 적은 글, poem: 그날의 시(제목·시인·본문), saved: 저장한 때 } }
// 그날의 시를 같이 저장해 두어서, 나중에 poems.js가 바뀌어도 그날 어떤 시였는지 알 수 있어요.
// 예전(시마다 저장하던 때)의 'memos'는 지우지 않고, 내 기록 아래 '날짜 없는 예전 글'로 보여줘요.
const dayKey = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const todayKey = dayKey(today);
const snap = p => ({ title: p.title, author: p.author, text: p.text, note: p.note });
function readStore(name){
  try { const v = JSON.parse(localStorage.getItem(name) || "{}"); return v && typeof v === "object" && !Array.isArray(v) ? v : {}; }
  catch(e){ return {}; }
}
const loadDiary = () => readStore("diary");
const loadMemos = () => readStore("memos");
const textOf = v => typeof v === "string" ? v : (v && typeof v.text === "string" ? v.text : "");

// 적는 대로 잠깐(0.6초) 쉬었다가 저장하고 "저장됐어요"를 잠깐 보여줘요
function autosave(box, status, getSave){
  let timer = null, stTimer = null;
  box.addEventListener("input", () => {
    const t = box.value, save = getSave();
    clearTimeout(timer);
    timer = setTimeout(() => {
      if (!save || !save(t)) return;
      status.textContent = "저장됐어요"; status.className = "memo-status show";
      clearTimeout(stTimer); stTimer = setTimeout(() => { status.className = "memo-status"; }, 1600);
    }, 600);
  });
}

// 하루치 글 저장 (글을 다 지우면 그날 기록도 없어져요)
function saveDay(k, t, poem){
  const diary = loadDiary(), old = diary[k];
  if (t.trim()) diary[k] = { text: t, poem: (old && old.poem) || poem, saved: new Date().toISOString() };
  else delete diary[k];
  try { localStorage.setItem("diary", JSON.stringify(diary)); } catch(e){ return false; }
  // 같은 날의 글이 두 곳(오늘의 시 아래, 달력에서 펼친 날)에 보이면 서로 맞춰요
  if (k === todayKey && document.activeElement !== $("memoText")) $("memoText").value = t;
  if (openDay === k && document.activeElement !== $("dvMemo")) $("dvMemo").value = t;
  renderCal();
  return true;
}

// 오늘의 시 아래 '내 생각 적기': 오늘 날짜의 기록이에요. 내 주머니에서 다른 시를 꺼내 볼 때는 숨겨요.
function showMemo(){
  const isToday = current === todayIdx;
  $("memo").hidden = !isToday;
  if (!isToday) return;
  const t = textOf(loadDiary()[todayKey]);
  $("memoText").value = t;
  $("memo").open = t !== "";                              // 적어 둔 글이 있으면 펼친 채로, 없으면 접힌 채로
  $("memoStatus").className = "memo-status"; $("memoStatus").textContent = "";
}
autosave($("memoText"), $("memoStatus"), () => t => saveDay(todayKey, t, snap(POEMS[todayIdx])));

// ── 내 기록: 한 달 달력 ──
const cal = { y: today.getFullYear(), m: today.getMonth() };   // 지금 보고 있는 달
const START_DAY = "2026-11-22";   // 사이트를 연 날: 이날부터 지난 시를 다시 볼 수 있어요
let openDay = null;            // 달력에서 펼친 날 ('2026-11-20') 또는 예전 글 ('old:제목|시인')
let daySave = null;            // 펼친 글을 고치면 어디에 저장할지
function renderCal(){
  const diary = loadDiary(), grid = $("calGrid");
  $("calMonth").textContent = cal.y + "년 " + (cal.m + 1) + "월";
  $("calNext").disabled = cal.y * 12 + cal.m >= today.getFullYear() * 12 + today.getMonth();   // 이번 달 뒤로는 안 넘어가요
  grid.innerHTML = "";
  "일월화수목금토".split("").forEach(w => {
    const s = document.createElement("span"); s.className = "cal-wd"; s.textContent = w; s.setAttribute("aria-hidden", "true"); grid.appendChild(s);
  });
  const first = new Date(cal.y, cal.m, 1).getDay(), last = new Date(cal.y, cal.m + 1, 0).getDate();
  for (let i = 0; i < first; i++) grid.appendChild(document.createElement("span"));
  for (let d = 1; d <= last; d++) {
    const k = dayKey(new Date(cal.y, cal.m, d)), has = textOf(diary[k]).trim() !== "";
    // 누를 수 있는 날: 사이트를 연 날(START_DAY)부터 오늘까지, 그리고 글을 적은 날
    // 그 전 날짜와 미래 날짜는 흐린 글자라서 눌러도 아무 일 없어요
    const can = has || (k >= START_DAY && k <= todayKey);
    const el = document.createElement(can ? "button" : "span");
    el.className = "cal-day" + (can ? " can" : " off") + (has ? " has" : "") + (k === todayKey ? " today" : "") + (k === openDay ? " sel" : "");
    const num = document.createElement("span"); num.className = "num"; num.textContent = d; el.appendChild(num);
    if (can) {
      el.type = "button";
      el.setAttribute("aria-label", (cal.m + 1) + "월 " + d + "일 시" + (has ? "와 내 글" : "") + " 보기");
      el.onclick = () => openDate(k);
    }
    if (k === todayKey) el.setAttribute("aria-current", "date");
    grid.appendChild(el);
  }
  renderOld();
}
$("calPrev").onclick = () => { if (--cal.m < 0) { cal.m = 11; cal.y--; } renderCal(); };
$("calNext").onclick = () => { if (++cal.m > 11) { cal.m = 0; cal.y++; } renderCal(); };

// 펼친 날: 편지지 모양의 시 + 주머니 속 한마디 + 고칠 수 있는(또는 새로 적을 수 있는) 글
function showDay(label, poem, text, save){
  const p = poem || {};
  $("dvDate").textContent = label;
  $("dvTitle").textContent = p.title || "(시를 찾지 못했어요)";
  $("dvAuthor").textContent = p.author || "";
  setPoemText($("dvText"), p.text || "");
  // 한마디: 저장된 시에 한마디가 없으면(예전 기록) 지금 시 목록에서 같은 시를 찾아 보여줘요
  const same = POEMS.find(q => keyOf(q) === keyOf(p));
  const note = Array.isArray(p.note) && p.note.length ? p.note : (same ? same.note : []);
  $("dvNote").hidden = note.length === 0;
  $("dvNote").innerHTML = "<h2>주머니 속 한마디</h2>" + note.map(t => "<p>" + t + "</p>").join("");
  $("dvMemo").value = text || "";
  $("dvStatus").className = "memo-status"; $("dvStatus").textContent = "";
  daySave = save;
  $("dayView").hidden = false;
  $("dayView").scrollIntoView({ behavior: reduceMotionNow() ? "auto" : "smooth", block: "start" });
}
// 글을 적은 날은 저장해 둔 그날의 시를, 안 적은 날은 날짜로 계산한 시를 보여줘요
function openDate(k){
  const [y, m, d] = k.split("-").map(Number), date = new Date(y, m - 1, d);
  const e = loadDiary()[k], has = textOf(e).trim() !== "";
  if (!has && !(k >= START_DAY && k <= todayKey)) return;
  const poem = has && e.poem ? e.poem : snap(POEMS[idxOf(date)]);
  openDay = k;
  showDay(fmtDate(date) + "의 시", poem, has ? textOf(e) : "", t => saveDay(k, t, poem));
  renderCal();
}
autosave($("dvMemo"), $("dvStatus"), () => daySave);

// 날짜 없는 예전 글 (시마다 저장하던 때의 글)
function renderOld(){
  const memos = loadMemos(), keys = Object.keys(memos).filter(k => textOf(memos[k]).trim());
  const ul = $("oldList");
  $("oldMemos").hidden = keys.length === 0;
  ul.innerHTML = "";
  keys.forEach(k => {
    const cut = k.lastIndexOf("|"), title = cut < 0 ? k : k.slice(0, cut), author = cut < 0 ? "" : k.slice(cut + 1);
    const li = document.createElement("li"), b = document.createElement("button"), s = document.createElement("span");
    b.type = "button"; b.textContent = title + " "; s.textContent = author; b.appendChild(s);
    b.onclick = () => openOld(k, title, author);
    li.appendChild(b); ul.appendChild(li);
  });
}
function openOld(k, title, author){
  openDay = "old:" + k;
  const p = POEMS.find(p => keyOf(p) === k) || { title, author, text: "(지금 시 목록에는 없는 시예요)" };
  showDay("날짜 없는 예전 글", p, textOf(loadMemos()[k]), t => {
    const memos = loadMemos();
    if (t.trim()) memos[k] = t; else delete memos[k];
    try { localStorage.setItem("memos", JSON.stringify(memos)); } catch(e){ return false; }
    renderOld();
    return true;
  });
  renderCal();
}
const reduceMotionNow = () => matchMedia("(prefers-reduced-motion: reduce)").matches;

function render(){
  const p = POEMS[current];
  $("from").hidden = current === todayIdx;   // 오늘의 시가 아니면 "내 주머니에서 꺼낸 시"라고 알려줘요
  $("title").textContent = p.title;
  $("author").textContent = p.author;
  setPoemText($("text"), p.text);
  $("note").innerHTML = "<h2>주머니 속 한마디</h2>" + p.note.map(t => "<p>" + t + "</p>").join("");
  // 내일 시는 제목만 살짝: 오늘의 시를 볼 때만 (내 주머니에서 다른 시를 꺼내 볼 때는 숨겨요)
  $("tomorrow").textContent = "내일 주머니에는: " + POEMS[tomorrowIdx].title;
  $("tomorrow").hidden = current !== todayIdx;
  const el = $("poem"); el.classList.remove("in"); void el.offsetWidth; el.classList.add("in");
  justAdded = null;
  showMemo();
  renderAsk();
  renderSaved();
}

// 시 아래 '내 주머니에 넣을까요?' 자리 — 네 가지 모습 중 하나를 보여줘요
function renderAsk(){
  const k = keyOf(POEMS[current]), box = $("ask");
  if (favs.includes(k)) {
    // 넣어 둔 시: 방금 넣었으면 "넣었어요", 전에 넣었으면 "들어 있어요" + 작은 [꺼내기]
    box.className = "ask done";
    box.innerHTML = '<p class="ask-msg">' + (justAdded === k ? "주머니에 넣었어요" : "주머니에 들어 있어요") +
      '</p><button class="link" data-act="out">꺼내기</button>';
  } else if (skipped.has(k)) {
    // [그냥 둘게요]를 누른 시: 질문은 접고 작은 글자 버튼만
    box.className = "ask quiet";
    box.innerHTML = '<button class="link" data-act="in">주머니에 넣기</button>';
  } else {
    // 처음 보는 시: 질문 + 두 버튼
    box.className = "ask";
    box.innerHTML = '<p class="ask-q">이 시를 내 주머니에 넣을까요?</p>' +
      '<div class="ask-btns"><button class="yes" data-act="in">넣을게요</button><button data-act="skip">그냥 둘게요</button></div>';
  }
}

$("ask").onclick = e => {
  const act = e.target.dataset && e.target.dataset.act; if (!act) return;
  const k = keyOf(POEMS[current]);
  if (act === "in")   { if (!favs.includes(k)) favs = [...favs, k]; justAdded = k; skipped.delete(k); }
  if (act === "out")  { favs = favs.filter(x => x !== k); justAdded = null; skipped.add(k); }   // 꺼내면 작은 '주머니에 넣기'만 남아요
  if (act === "skip") { skipped.add(k); }
  saveFavs(favs); renderAsk(); renderSaved();
  const next = $("ask").querySelector("button"); if (next) next.focus({preventScroll:true, focusVisible:false});
};

function renderSaved(){
  const box = $("saved"), ul = $("savedList");
  const list = favs.map(k => POEMS.find(p => keyOf(p) === k)).filter(Boolean);   // poems.js에서 지운 시는 건너뛰어요
  box.hidden = list.length === 0;
  ul.innerHTML = "";
  list.forEach(p => {
    const li = document.createElement("li"), b = document.createElement("button");
    b.innerHTML = p.title + " <span>" + p.author + "</span>";
    // 내 주머니의 시를 누르면, 날짜와 상관없이 그 시가 바로 열려요
    b.onclick = () => { current = POEMS.indexOf(p); render(); window.scrollTo(0, 0); };
    li.appendChild(b); ul.appendChild(li);
  });
}

render();
renderCal();

// ── 가죽 주머니: 들어올 때마다 닫혀 있어요 (안에 든 시는 날짜로 정해져서 같은 날엔 늘 같은 시) ──
const html = document.documentElement, gate = $("gate");
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");
try { localStorage.removeItem("pouchDay"); } catch(e){}   // 예전 '오늘 열었음' 기록은 이제 쓰지 않아 지워요
let opening = false;

// 주머니 닫기: 오늘의 시를 주머니에 넣고 첫 화면(주머니)으로 돌아가요
function showGate(){
  current = todayIdx; render();
  gate.className = "gate";
  html.classList.remove("opened", "rising");
}

// 주머니 열림 완료: 주머니는 사라지고 시가 보여요
function finishGate(){
  current = todayIdx; render();
  html.classList.add("opened");
  gate.className = "gate"; opening = false;
  $("title").setAttribute("tabindex", "-1"); $("title").focus({preventScroll:true});
}

// 주머니를 누르면: 입구가 살짝 열림 → 주머니가 천천히 흐려짐 → 그 자리에 편지지가 스르륵 떠오름 (약 1.4초)
function openPouch(){
  if (opening) return; opening = true;
  if (reduceMotion.matches) { finishGate(); return; }   // 움직임 줄이기: 연출 없이 바로 편지지
  const step = (ms, fn) => setTimeout(fn, ms);
  gate.classList.add("open");
  step(250, () => gate.classList.add("fade"));
  step(700, () => { html.classList.add("rising"); finishGate(); });
  step(1600, () => html.classList.remove("rising"));
}

$("pouchBtn").onclick = openPouch;
function goHome(){ if (opening) return; showGate(); window.scrollTo(0, 0); $("pouchBtn").focus({preventScroll:true, focusVisible:false}); }
$("closeBtn").onclick = goHome;
$("home").onclick = e => { e.preventDefault(); goHome(); };   // 맨 위 "시 주머니"를 누르면 첫 화면으로
</script>
</body>
</html>
